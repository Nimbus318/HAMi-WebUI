name: Fork Images

# Manually build any branch/tag/sha of this fork and publish the images to this
# fork's own GHCR namespace, so the device lab can pull them without building
# anything locally. Upstream CI only publishes on push to main and on tags, so
# pre-merge verification has no image otherwise.
#
# Usage:
#   gh workflow run fork-images.yaml -f ref=<branch|tag|sha> [-f tag=<image tag>]
#
# The repository guard keeps this inert if the file ever reaches upstream.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        default: main
      tag:
        description: "Image tag (default: sanitized ref)"
        required: false
      platforms:
        description: "Target platforms"
        required: false
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'Nimbus318/HAMi-WebUI'
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: fe
            context: .
          - component: be
            context: ./server
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare image tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            # Branch names may contain "/" and other characters a tag cannot hold.
            tag="$(printf '%s' "${{ inputs.ref }}" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-120)"
          fi
          echo "IMAGE=ghcr.io/${owner}/hami-webui-${{ matrix.component }}-oss:${tag}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
