name: Fork Images

# Build any ref of this fork on demand and publish to this fork's own GHCR
# namespace, so the device lab pulls images instead of the laptop cross-building
# linux/amd64 under emulation. Upstream CI publishes only on push to main and on
# tags — pull requests build with push disabled, because fork PRs cannot hold
# registry credentials.
#
#   # 1.x layout (main): separate frontend and backend images
#   gh workflow run fork-images.yaml -f ref=fix/my-branch
#
#   # 2.0 layout (feat/split-mode and friends): one unified image
#   gh workflow run fork-images.yaml -f ref=feat/split-mode -f targets=app
#
#   # anything else: name the image and point at its Dockerfile
#   gh workflow run fork-images.yaml -f ref=my-branch \
#     -f targets=hami-webui-probe -f context=./tools -f dockerfile=tools/Dockerfile
#
# The repository guard keeps this inert if the file ever reaches upstream.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        default: main
      targets:
        description: "Comma-separated: fe, be, app, or a custom image name"
        required: false
        default: fe,be
      tag:
        description: "Image tag (default: sanitized ref)"
        required: false
      context:
        description: "Build context for a custom target"
        required: false
        default: "."
      dockerfile:
        description: "Dockerfile for a custom target"
        required: false
        default: Dockerfile
      platforms:
        description: "Target platforms"
        required: false
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  plan:
    if: github.repository == 'Nimbus318/HAMi-WebUI'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Resolve targets and tag
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          CUSTOM_CONTEXT: ${{ inputs.context }}
          CUSTOM_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            # Branch names may hold "/" and other characters an image tag cannot.
            tag="$(printf '%s' "$INPUT_REF" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-120)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          entries=""
          IFS=','
          for t in $TARGETS; do
            t="$(printf '%s' "$t" | tr -d '[:space:]')"
            [ -n "$t" ] || continue
            case "$t" in
              fe)  image=hami-webui-fe-oss; ctx=.;        dockerfile=Dockerfile ;;
              be)  image=hami-webui-be-oss; ctx=./server; dockerfile=server/Dockerfile ;;
              app) image=hami-webui;        ctx=.;        dockerfile=Dockerfile ;;
              *)   image="$t";              ctx="$CUSTOM_CONTEXT"; dockerfile="$CUSTOM_DOCKERFILE" ;;
            esac
            entries="$entries$(jq -cn --arg n "$t" --arg i "$image" --arg c "$ctx" --arg d "$dockerfile" \
              '{name:$n, image:$i, context:$c, dockerfile:$d}')"$'\n'
          done
          unset IFS

          matrix="$(printf '%s' "$entries" | jq -sc '{include: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Build plan"
            echo ""
            echo "- ref: \`$INPUT_REF\`"
            echo "- tag: \`$tag\`"
            printf '%s' "$entries" | jq -r '"- `\(.image)` from `\(.dockerfile)` (context `\(.context)`)"'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image reference
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/${{ matrix.image }}:${{ needs.plan.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: echo "Pushed \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
