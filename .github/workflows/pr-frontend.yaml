name: Temporary PR 328 calendar diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum
      - run: make bootstrap
      - run: node test/web-entry/diagnose-picker.mjs
      - run: make build build-web-entry
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Isolated original assertion with lifecycle trace
        continue-on-error: true
        run: |
          mkdir -p evidence
          node --test --test-concurrency=1 --test-name-pattern='custom trend drafts survive' test/web-entry/web-entry.browser.test.mjs 2>&1 | tee evidence/targeted.log
      - name: Second original assertion with entry trace
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern='custom trend drafts survive' test/web-entry/web-entry.browser.test.mjs 2>&1 | tee evidence/targeted-second.log
      - name: Third original assertion with entry trace
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern='custom trend drafts survive' test/web-entry/web-entry.browser.test.mjs 2>&1 | tee evidence/targeted-third.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr328-calendar-lifecycle
          path: evidence/
